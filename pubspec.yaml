name: yodoctor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.2

  # UI & Theming
  chroma_kit: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  persistent_bottom_nav_bar: ^6.2.1

  # Navigation & Utilities
  go_router: ^17.2.3
  intl: ^0.19.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # http Request
  dio: ^5.10.0


  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/

    - .env


flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logos/app_logo.png"

  adaptive_icon_background: "assets/logos/app_logo_bg.png"
  adaptive_icon_foreground: "assets/logos/app_logo_fg.png"