name: yodoctor
description: "A comprehensive medical application for patients and doctors."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.2

  # UI, Theming & Components
  chroma_kit: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  persistent_bottom_nav_bar: ^6.2.1
  shimmer: ^3.0.0

  # Navigation & Routing
  go_router: ^17.2.3

  # Network & API
  dio: ^5.10.0
  http_parser: ^4.1.2
  mime: ^2.0.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Files & Media Handling
  file_picker: ^11.0.2
  image_picker: ^1.2.3
  open_filex: ^4.7.0
  path_provider: ^2.1.6

  # Scanner & QR Code
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # Maps & Location
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # Payment & External Launchers
  razorpay_flutter: ^1.4.5
  url_launcher: ^6.3.2

  # Utilities & Helpers
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_logo.png"
  adaptive_icon_background: "assets/logos/app_logo_bg.png"
  adaptive_icon_foreground: "assets/logos/app_logo_fg.png"